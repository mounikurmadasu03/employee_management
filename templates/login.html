<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        body { 
            font-family: Arial, sans-serif; 
            background-color: white; 
            text-align: center; 
        } 
 
        h1 { 
            color: #302b63; 
            margin-top: 50px; 
        } 
 
        form { 
            background-color: rgb(138, 165, 232); 
            width: 350px; 
            margin: 30px auto; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1); 
        } 
 
        label { 
            color: #302b63; 
            font-weight: bold; 
        } 
 
        input[type="text"], 
        input[type="password"] { 
            width: 90%; 
            padding: 10px; 
            margin-top: 8px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
        } 
 
        input[type="submit"], 
        input[type="reset"] { 
            padding: 10px 20px; 
            border: none; 
            border-radius: 5px; 
            color: white; 
            cursor: pointer; 
        }
        input[type="submit"] {
                    
           width: 100%;

            padding: 12px;

            border: none;

            border-radius: 5px;

            background-color: #00bcd4;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        input[type="submit"]:hover {
            background-color: #0097a7;
        }
        /* light mode*/
        body.light {
            background-color:white;
            color: #222;
        }

        body.light .container {
            background-color: rgb(144, 21, 21);
            color: #222;
        }

        body.light h1 {
            color: #222;
        }

        body.light input,
        body.light select,
        body.light textarea {
            background-color:white ;
            color: #222;
            border: 1px solid #ccc;
        }


        /* darkmode */

        body.dark {
            background-color: #121212;
            color: white;
        }

        body.dark .container {
            background-color: #1e1e1e;
            color: white;

            box-shadow:
                0 2px 10px rgba(255, 255, 255, 0.08);
        }

        body.dark h1 {
            color: white;
        }

        body.dark label {
            color: white;
        }

        body.dark input,
        body.dark select,
        body.dark textarea {
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #555;
        }

        body.dark input::placeholder,
        body.dark textarea::placeholder {
            color: #aaa;
        }

        body.dark option {
            background-color: #2b2b2b;
            color: rgb(18, 176, 124);
        }
        /* --THEME BUTTONS---- */

        .theme-buttons {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-right: 5px;
        }

        .theme-buttons a {
            color:rgb(25, 206, 190);
             
            text-decoration: none;

            border: 1px solid #00bcd4;

            padding: 8px 12px;

            border-radius: 5px;

            font-size: 14px;

            transition: 0.3s;
        }

        .theme-buttons a:hover {
            background-color: #00bcd4;

            color: white;
        }
    </style> 
</head>
<body class="{{theme}}">
  <div class="theme-buttons">
    <a href="/set-theme/light">☀ Light</a>
    <a href="/set-theme/dark">🌙 Dark</a>
  </div>
    <h2>login</h2>
    <form id="loginform" action="/login" method="post" >
        <label>username:</label><br>
        <input type="text" name="username" id="username" required>
        <br><br>
        <label>password:</label><br>
        <input type="password" name="password" id="password" required>
        <br><br>
        <button type="submit" value="register">login</button><br>
    </form>
    <div class="register-link">
        don't have an account?
        <a href="/register">Register</a>
    </div>
  </body>
</html>
