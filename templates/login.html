<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style> 
        body { 
            font-family: Arial, sans-serif; 
            background-color: white; 
            text-align: center; 
        } 
 
        h1 { 
            color: #302b63; 
            margin-top: 50px; 
        } 
 
        form { 
            background-color: rgb(138, 165, 232); 
            width: 350px; 
            margin: 30px auto; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.1); 
        } 
 
        label { 
            color: #302b63; 
            font-weight: bold; 
        } 
 
        input[type="text"], 
        input[type="password"] { 
            width: 90%; 
            padding: 10px; 
            margin-top: 8px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
        } 
 
        input[type="submit"], 
        input[type="reset"] { 
            padding: 10px 20px; 
            border: none; 
            border-radius: 5px; 
            color: white; 
            cursor: pointer; 
        }
        input[type="submit"] {
                    
           width: 100%;

            padding: 12px;

            border: none;

            border-radius: 5px;

            background-color: #00bcd4;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }


        input[type="submit"]:hover {
            background-color: #0097a7;
        }
 
 
        
        
    </style> 
</head>
<body>
    <h2>login</h2>
    <form id="loginform" action="/login" method="post" >
        <label>username:</label><br>
        <input type="text" name="username" id="username" required>
        <br><br>
        <label>password:</label><br>
        <input type="password" name="password" id="password" required>
        <br><br>
        <button type="submit" value="register">login</button><br>
    </form>
  </body>
</html>
