<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>search Employee</h1>
    <div class="search-box">
        <form action="/search" method="post">
            <label>Employee Name:</label>
            <input
              type="text"
              name="search_name"
              placeholder="Enter employee name"
              value="{{search_name}}"
              required
              >
              <button type="submit">
                search
              </button>
        </form>
    </div>
    <!--search Result-->
    {% if employees%}
    <div class="result">
        <table>
            <tr>
                <th>ID</th>
                <th>Full Name</th>
                <th>Email</th>
                <th>Department</th>
                <th>phone</th>
            </tr>
            {% for employee in employees%}
            <tr>
                <td>{{employee[0]}}</td>
                <td>{{employee[1]}}</td>
                <td>{{employee[2]}}</td>
                <td>{{employee[3]}}</td>
                <td>{{employee[4]}}</td>
            </tr>
            {% endfor%}
        </table>
    </div>
    {%elif search_name%}
    <p class="no-result">
        No employee found with the name
    </p>
</body>
</html>
