<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
  <style>
    
    /* General page styling */
body {
    font-family: Arial, sans-serif;
    background-color:white;
    margin: 0;
    padding: 0;
}

/* Container */
.container {
    max-width: 700px;
    margin: 40px auto;
    background: #5ebec3;
    padding: 25px 30px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}

/* Heading */
.container h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #be2469;
}

/* Form rows */
.row {
    display: flex;
    flex-wrap: wrap;
    margin-bottom: 15px;
}

/* Form group */
.form-group {
    flex: 1;
    display: flex;
    flex-direction: column;
    margin-right: 15px;
}

.form-group:last-child {
    margin-right: 0;
}

/* Labels */
label {
    font-weight: bold;
    margin-bottom: 5px;
    color: #f128ae9b;
}

/* Inputs, select, textarea */
input, select, textarea {
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    transition: border-color 0.3s ease;
}

input:focus, select:focus, textarea:focus {
    border-color: #19945f;
    outline: none;
}

/* Textarea */
textarea {
    resize: vertical;
    min-height: 80px;
}

/* Buttons */
.update-btn {
    background-color: #007bff;
    color: #fff;
    padding: 12px 18px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 15px;
    transition: background-color 0.3s ease;
}

.update-btn:hover {
    background-color: #0056b3;
}

/* Back link */
.back-btn {
    display: inline-block;
    margin-top: 20px;
    text-decoration: none;
    color: #007bff;
    font-weight: bold;
    transition: color 0.3s ease;
}

.back-btn:hover {
    color: #1800b3;
}
/* light mode*/
        body.light {
            background-color: #f5f5f5;
            color: #222;
        }

        body.light .container {
            background-color: white;
            color: #222;
        }

        body.light h1 {
            color: #222;
        }

        body.light input,
        body.light select,
        body.light textarea {
            background-color: white;
            color: #222;
            border: 1px solid #ccc;
        }


        /* darkmode */

        body.dark {
            background-color: #121212;
            color: white;
        }

        body.dark .container {
            background-color: #1e1e1e;
            color: white;

            box-shadow:
                0 2px 10px rgba(255, 255, 255, 0.08);
        }

        body.dark h1 {
            color: white;
        }

        body.dark label {
            color: white;
        }

        body.dark input,
        body.dark select,
        body.dark textarea {
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #555;
        }

        body.dark input::placeholder,
        body.dark textarea::placeholder {
            color: #aaa;
        }

        body.dark option {
            background-color: #2b2b2b;
            color: white;
        }
        /* --THEME BUTTONS---- */

        .theme-buttons {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-right: 5px;
        }

        .theme-buttons a {
            color:rgb(25, 206, 190);

            text-decoration: none;

            border: 1px solid #00bcd4;

            padding: 8px 12px;

            border-radius: 5px;

            font-size: 14px;

            transition: 0.3s;
        }

        .theme-buttons a:hover {
            background-color: #00bcd4;

            color: white;
        }
    </style>

</head>
<body class="{{theme}}">
    <div class="theme-buttons">
       <a href="/set-theme/light">☀ Light</a>
       <a href="/set-theme/dark">🌙 Dark</a>
    </div>
    <div class="container">
    <h2>Edit employee</h2>
    <form action="/edit-employee/{{employee['id']}}" method="post">
        <div class="row">
         <div class="form-group">
        <label for="name">Employee name:</label>
        <input type="text" name="employeename" id="employeename" placeholder="enter employee name" value="{{employee['name']}}" required>
        <label for="email">email:</label>
        <input type="text" name="email" id="email" placeholder="enter employee email" value="{{employee['email']}}" required>
         </div>
        </div>
        <div class="row">
         <div class="form-group">
        <label for="phone">phone:</label>
        <input type="tel" id="phone" name="phone"value="{{employee['phone']}}" required>
        <label for="department">Department:</label>
        <select id="department" name="department" value="{{employee['department']}}" required>
            <option value="">select department</option>
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="finance">finance</option>
            <option value="marketing">marketing</option>
        </select>
         </div>
        </div>
        <div class="row">
         <div class="form-group">
        <label for="salary">salary:</label>
        <input type="number" id="salary" name="salary" placeholder="enter your salary" value="{{employee['salary']}}" required>
        <label for="joining">joining:</label>
        <input type="date" name="joining" id="joining" required>
         </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label for="address">address</label>
                <textarea type="address" id="address" name="address" required>{{employee['address']or ' '}} </textarea>
            </div>
        </div>
        <div class="row">
         <div class="form-group">
        <button type="submit" class="update-btn">update employee</button>
        </div>
         </div>
          
    </form>
    <a href="/employees" class="back-btn"> back to employees</a>
</div>
</body>
</html>
