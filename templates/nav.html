<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>employee management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: arial, sans-serif;
        }

        /*navbar*/
        .navbar {
            background-color: rgb(75, 93, 162);
            padding: 15px 30px;
            display: flex;
            align-items: center;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            font-size: 16px;
        }
        /* ---logo---*/
        .logo{
            color:#ffffff;
            font-size: 22px;
            font-weight:bold;
        }
       /*navigation*/
        .nav-links {
            display: flex;
            align-items: center;
            list-style: none;
            gap: 20px;
        }
        .nav-links a{
            color:#ffffff;
            text-decoration:none;
            font-size: 16px;
            padding:8px 12px;
            border-radius: 5px;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: rgb(101, 197, 138);
        }
        /*--- log out---*/
        .logout-button {
            background-color: #00bcd4;
            padding: 8px 14px;
            border-radius: 5px;
        }

        .logout-button:hover {
            background-color:#4300a7;
            color: white !important;
        }
        /*register button*/
        .register-btn {
            background-color: #00bcd4;
            padding: 8px 15px;
            border-radius: 5px;
        }

        .register-btn:hover {
            background-color: #4300a7;
            color: white !important;
        }

        /*content*/
        .content {
            padding: 50px;
            text-align: center;
        }
        .theme-buttons {
            display: flex;
            gap: 10px;

            margin-right: 20px;
        }
        /* light mode*/
        body.light {
            background-color: #f5f5f5;
            color: #222;
        }

        body.light .container {
            background-color: white;
            color: #222;
        }

        body.light h1 {
            color: #222;
        }

        body.light input,
        body.light select,
        body.light textarea {
            background-color: white;
            color: #222;
            border: 1px solid #ccc;
        }


        /* darkmode */

        body.dark {
            background-color: #121212;
            color: white;
        }

        body.dark .container {
            background-color: #1e1e1e;
            color: white;

            box-shadow:
                0 2px 10px rgba(255, 255, 255, 0.08);
        }

        body.dark h1 {
            color: white;
        }

        body.dark label {
            color: white;
        }

        body.dark input,
        body.dark select,
        body.dark textarea {
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #555;
        }

        body.dark input::placeholder,
        body.dark textarea::placeholder {
            color: #aaa;
        }

        body.dark option {
            background-color: #2b2b2b;
            color: white;
        }
        /* --THEME BUTTONS---- */

        .theme-buttons {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-right: 5px;
        }

        .theme-buttons a {
            color: rgb(25, 206, 190);
             

            text-decoration: none;

            border: 1px solid #00bcd4;

            padding: 8px 12px;

            border-radius: 5px;

            font-size: 14px;

            transition: 0.3s;
        }

        .theme-buttons a:hover {
            background-color: #00bcd4;

            color: white;
        }
    </style>
</head>

<body class="{{theme}}">
    <nav class="navbar">
        <div class="logo">
            employee management system
        </div>
        <div class="theme-buttons">
            <a href="/set-theme/light">
                ☀ Light
            </a>
            <a href="/set-theme/dark">
                🌙 Dark
            </a>
        </div>
        <ul class="nav-links">
            <li>
                <a href="/home">
                    home
                </a>
            </li>
            <li>
                <a href="/employees">
                    employee
                </a>
            </li>
            <li>
                <a href="/addemployee">add employee</a>
            </li>
            <li>
                <a href="/search">
                    search
                </a>
            </li>
            <li>
                <a href="/register">
                    <button class="register-btn" type="submit">register</button>
                </a>
            </li>
            <li>
                <a href="/logout">
              <button class="logout-button" type="submit">Logout</button>
            </a>
             </li>

        </ul>
    </nav>
    <div class="content">
        {% if fullname %}
           <h1> welcome ,{{fullname}}!</h1>
        {% else %}
           <h1> welcome to employee management system</h1>
        {% endif %}   
        <p>manage your employee easely</p>
    </div>
</body>

</html>
