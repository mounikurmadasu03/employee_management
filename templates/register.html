<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* light mode*/
        body.light {
            background-color: #f5f5f5;
            color: #222;
        }

        body.light .container {
            background-color: white;
            color: #222;
        }

        body.light h1 {
            color: #222;
        }

        body.light input,
        body.light select,
        body.light textarea {
            background-color: white;
            color: #222;
            border: 1px solid #ccc;
        }


        /* darkmode */

        body.dark {
            background-color: #121212;
            color: white;
        }

        body.dark .container {
            background-color: #1e1e1e;
            color: white;

            box-shadow:
                0 2px 10px rgba(255, 255, 255, 0.08);
        }

        body.dark h1 {
            color: white;
        }

        body.dark label {
            color: white;
        }

        body.dark input,
        body.dark select,
        body.dark textarea {
            background-color: #2b2b2b;
            color: white;
            border: 1px solid #555;
        }

        body.dark input::placeholder,
        body.dark textarea::placeholder {
            color: #aaa;
        }

        body.dark option {
            background-color: #2b2b2b;
            color: white;
        }
        /* --THEME BUTTONS---- */

        .theme-buttons {
            display: flex;

            align-items: center;

            gap: 10px;

            margin-right: 5px;
        }

        .theme-buttons a {
            color: rgb(25, 206, 190);
             

            text-decoration: none;

            border: 1px solid #00bcd4;

            padding: 8px 12px;

            border-radius: 5px;

            font-size: 14px;

            transition: 0.3s;
        }

        .theme-buttons a:hover {
            background-color: #00bcd4;

            color: white;
        }
/* Registration form */
form {
    max-width: 400px;
    margin: 40px auto;
    padding: 20px;
    border-radius: 8px;
    background-color: rgb(125, 214, 180);
    box-shadow: 0 0 10px rgba(32, 157, 179, 0.1);
}
label {
    font-weight: bold;
}
input[type="text"],
input[type="password"] {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    border: 1px solid #39e1de;
    border-radius: 4px;
}
button {
    margin-top: 10px;
    padding: 8px 16px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}
button[type="submit"] {
    background-color: #2a7e98;
    color: rgb(29, 186, 158);
}
button[type="reset"] {
    background-color: #f44336;
    color: white;
}
button:hover {
    opacity: 0.9;
}
</style>

</head>
<body class="{{theme}}">
    <div class="theme-buttons">
        <a href="/set-theme/light">
                ☀ Light
        </a>
        <a href="/set-theme/dark">
                🌙 Dark
        </a>

    </div>

    <form id="registrationform" action="/register" method="post" >
        <label>fullname:</label><br>
        <input type="text" name="fullname" id="fullname" required>
        <br><br>
        <label>username:</label><br>
        <input type="text" name="username" id="username" required>
        <br><br>
        <label>password:</label><br>
        <input type="password" name="password" id="password" required>
        <br><br>
        <button type="submit" value="register">register</button>
        <button type="reset" value="reset">reset</button>
    </form>
</body>
</html>
